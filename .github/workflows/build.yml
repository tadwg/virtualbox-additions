# ドライバのビルド: src の変更を main に push すると、btron3sdk コンテナ
# (tadwg/btron3sdk-linux の Dockerfile) でビルドし、bin/ を更新してコミットする.
name: build

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'build.sh'
      - '.github/workflows/build.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Checkout btron3sdk-linux (build environment)
        uses: actions/checkout@v4
        with:
          repository: tadwg/btron3sdk-linux
          path: .btron3sdk

      - uses: docker/setup-buildx-action@v3

      # brightv 開発環境のイメージ (公開はしない. GitHub Actions のキャッシュで再利用)
      - name: Build btron3sdk image
        uses: docker/build-push-action@v6
        with:
          context: .btron3sdk
          load: true
          push: false
          tags: btron3sdk:latest
          cache-from: type=gha,scope=btron3sdk
          cache-to: type=gha,scope=btron3sdk,mode=max

      - name: Build driver
        run: |
          docker run --rm -v "$PWD":/workspace btron3sdk:latest bash /workspace/build.sh
          sudo chown -R "$(id -u):$(id -g)" bin

      - name: Commit bin/
        run: |
          git add bin
          if git diff --cached --quiet; then
            echo "no changes"
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Update driver binaries [skip ci]

          Built by GitHub Actions from ${GITHUB_SHA}"
          git push
